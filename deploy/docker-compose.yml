name: animaldatabase

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *logging
    depends_on:
      - api
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      OLD_DOMAIN: ${OLD_DOMAIN:-http://old.invalid}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      web:
        ipv4_address: ${PROXY_IP:-172.30.0.10}

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      additional_contexts:
        ui-src: ${UI_SOURCE:-../../AnimalDatabase_UI}
    image: animaldatabase-api:latest
    restart: unless-stopped
    logging: *logging
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__AnimalDatabase: Server=mariadb;Port=3306;Database=${MARIADB_DATABASE:-animaldatabase};User=${APP_DB_USER:?Set APP_DB_USER in .env};Password=${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      Admin__ApiKey: ${ADMIN_API_KEY:?Set ADMIN_API_KEY in .env}
      DeepL__ApiKey: ${DEEPL_API_KEY:?Set DEEPL_API_KEY in .env}
      LibreTranslate__BaseUrl: ${LIBRETRANSLATE_BASE_URL:-http://libretranslate:5000/}
      LibreTranslate__ApiKey: ${LIBRETRANSLATE_API_KEY:-}
      ForwardedHeaders__KnownProxies__0: ${PROXY_IP:-172.30.0.10}
    networks:
      - web
      - db

  libretranslate:
    image: libretranslate/libretranslate:v1.9.6
    restart: unless-stopped
    logging: *logging
    environment:
      LT_LOAD_ONLY: en,de
      LT_THREADS: "1"
      LT_DISABLE_WEB_UI: "true"
      LT_DISABLE_FILES_TRANSLATION: "true"
      LT_UPDATE_MODELS: "true"
    volumes:
      - libretranslate_models:/home/libretranslate/.local
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "./venv/bin/python scripts/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 600s
    networks:
      - web

  mariadb:
    image: mariadb:11.8
    restart: unless-stopped
    logging: *logging
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-animaldatabase}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./init/02-app-user.sh:/docker-entrypoint-initdb.d/02-app-user.sh:ro
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - db

  backup:
    image: mariadb:11.8
    restart: unless-stopped
    logging: *logging
    depends_on:
      mariadb:
        condition: service_healthy
    entrypoint: [ "bash", "/usr/local/bin/backup.sh" ]
    environment:
      MYSQL_PWD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-animaldatabase}
      BACKUP_TIME_UTC: ${BACKUP_TIME_UTC:-01:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backup/backup.sh:/usr/local/bin/backup.sh:ro
      - ${BACKUP_HOST_DIR:-../../backups}:/backups
    networks:
      - db

networks:
  web:
    ipam:
      config:
        - subnet: ${WEB_SUBNET:-172.30.0.0/24}
  db:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  mariadb_data:
  libretranslate_models:
